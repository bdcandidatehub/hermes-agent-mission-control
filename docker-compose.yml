# Local Postgres for Hermy HQ.  Start it with:  npm run db:up
# Bound to 127.0.0.1 only, so nothing else on your network can reach it. Data lives in the named volume
# "hermy_pgdata" and survives restarts and `docker compose down` (only `down -v` deletes it).
services:
  postgres:
    image: postgres:16
    container_name: hermy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hermy
      POSTGRES_PASSWORD: hermy_local # local-only; the port is not exposed beyond 127.0.0.1
      POSTGRES_DB: hermy
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      - hermy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermy -d hermy"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Friday's voice: Kokoro-82M (Apache-2.0) behind an OpenAI-compatible /v1/audio/speech endpoint.
  # Opt-in:  npm run tts:up   (first run downloads ~1.4 GB; the model loads in ~30-60 s after start)
  tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.9.0
    container_name: hermy-tts
    profiles: ["voice"]
    restart: unless-stopped
    mem_limit: 2g
    ports:
      - "127.0.0.1:8880:8880"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8880/health',timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  hermy_pgdata:
